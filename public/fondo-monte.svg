<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMax slice">
  <defs>
    <!-- Quebracho colorado: tronco torcido, copa densa y ramas que se abren (base en 0,0) -->
    <g id="quebracho" fill="#4d5b36" fill-opacity="0.9">
      <path d="M-10 0 C-6 -90 -16 -170 -5 -235 L7 -235 C12 -170 5 -90 12 0 Z"/>
      <path d="M-4 -200 Q-50 -232 -82 -284 L-74 -290 Q-40 -252 2 -222 Z"/>
      <path d="M5 -190 Q58 -222 88 -272 L96 -266 Q62 -226 9 -180 Z"/>
      <circle cx="0" cy="-260" r="62"/>
      <circle cx="-60" cy="-276" r="50"/>
      <circle cx="60" cy="-278" r="52"/>
      <circle cx="-24" cy="-312" r="48"/>
      <circle cx="30" cy="-316" r="46"/>
      <circle cx="-86" cy="-304" r="34"/>
      <circle cx="92" cy="-302" r="36"/>
    </g>
    <!-- Ave en vuelo, color bordó del quebracho -->
    <g id="ave" fill="#6e2a1c" fill-opacity="0.85">
      <path d="M0 0 Q15 -18 30 -4 Q45 -18 60 0 Q45 -6 30 8 Q15 -6 0 0 Z"/>
    </g>
  </defs>

  <g fill-opacity="1">
    <use href="#quebracho" transform="translate(70 1600) scale(1.25)"/>
    <use href="#quebracho" transform="translate(300 1575) scale(0.85)"/>
    <use href="#quebracho" transform="translate(540 1610) scale(1.4)"/>
    <use href="#quebracho" transform="translate(790 1580) scale(0.95)"/>
    <use href="#quebracho" transform="translate(1020 1605) scale(1.3)"/>
    <use href="#quebracho" transform="translate(1170 1585) scale(0.7)"/>
  </g>

  <g>
    <use href="#ave" transform="translate(700 430) scale(1.3)"/>
    <use href="#ave" transform="translate(790 395) scale(1)"/>
  </g>
</svg>
