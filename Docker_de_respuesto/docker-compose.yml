services:
  app:
    build: .
    image: plaza-castelli:latest
    container_name: plaza-castelli
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_PUBLIC_URL:-http://localhost:8089}
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/app/database.sqlite
    ports:
      - "${APP_PORT:-8089}:80"
    volumes:
      - app-storage:/app/storage/app

volumes:
  app-storage:
